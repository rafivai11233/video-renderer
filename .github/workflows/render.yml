name: Video Render Pipeline
run-name: render ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique render job id from n8n'
        required: true
      plan:
        description: 'JSON plan with voice, rate and scenes'
        required: true

permissions:
  contents: write

concurrency:
  group: video-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System and Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --no-cache-dir edge-tts requests

      - name: Fast Video Render & Mastering
        env:
          PLAN: ${{ inputs.plan }}
          SCENES_DATA: ${{ inputs.plan }}
          RENDER_ID: ${{ inputs.job_id }}
        run: python render.py

      - name: Publish Video Release
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          TARGET_FILE=""
          if [ -f "out/final.mp4" ]; then
            TARGET_FILE="out/final.mp4"
          elif [ -f "output/final_video.mp4" ]; then
            TARGET_FILE="output/final_video.mp4"
          fi
          
          if [ -n "$TARGET_FILE" ]; then
            gh release create "$JOB_ID" "$TARGET_FILE" --title "$JOB_ID" --notes "Automated Render Complete" --latest=false
          else
            echo "Error: Output video not found!"
            exit 1
          fi

      - name: Prune Old Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName -q '.[5:][].tagName' | xargs -r -I{} gh release delete {} --cleanup-tag -y || true
