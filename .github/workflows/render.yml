name: Video Renderer

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Video plan JSON payload'
        required: true
        type: string
      job_id:
        description: 'Unique Job ID / Tag name'
        required: true
        type: string

concurrency:
  group: video-render-${{ inputs.job_id }}
  cancel-in-progress: true

jobs:
  render:
    name: Render • ${{ inputs.job_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    env:
      JOB_ID: ${{ inputs.job_id }}
      PLAN: ${{ inputs.plan }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if [[ -z "$JOB_ID" ]]; then
            echo "::error::job_id is required"
            exit 1
          fi
          if [[ -z "$PLAN" ]]; then
            echo "::error::plan is required"
            exit 1
          fi
          echo "$PLAN" | python3 -m json.tool > /dev/null || {
            echo "::error::plan is not valid JSON"
            exit 1
          }
          echo "✅ Inputs validated"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg --no-install-recommends
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir edge-tts requests pillow

      - name: Fast Video Render & Mastering
        id: render
        run: |
          echo "🚀 Starting render for job: $JOB_ID"
          mkdir -p out
          python render.py

          if [ -f "out/final.mp4" ]; then
            echo "TARGET_FILE=out/final.mp4" >> $GITHUB_OUTPUT
          elif [ -f "output/final_video.mp4" ]; then
            echo "TARGET_FILE=output/final_video.mp4" >> $GITHUB_OUTPUT
          else
            echo "::error::No output video found"
            ls -la out/ output/ 2>/dev/null || true
            exit 1
          fi

      - name: Generate premium thumbnail
        id: thumb
        run: |
          TARGET="${{ steps.render.outputs.TARGET_FILE }}"
          THUMB="out/thumbnail.jpg"

          ffmpeg -y -ss 00:00:01.5 -i "$TARGET" \
            -vframes 1 -q:v 2 \
            -vf "scale=1280:-1" \
            "$THUMB" 2>/dev/null || \
          ffmpeg -y -i "$TARGET" -vframes 1 -q:v 2 -vf "scale=1280:-1" "$THUMB"

          echo "THUMB_FILE=$THUMB" >> $GITHUB_OUTPUT
          echo "✅ Thumbnail generated"

      - name: Collect render stats
        id: stats
        run: |
          TARGET="${{ steps.render.outputs.TARGET_FILE }}"
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$TARGET")
          SIZE=$(du -h "$TARGET" | cut -f1)
          RESOLUTION=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$TARGET")

          echo "DURATION=${DURATION%.*}s" >> $GITHUB_OUTPUT
          echo "SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "RESOLUTION=$RESOLUTION" >> $GITHUB_OUTPUT

      - name: Publish Video Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.job_id }}
        run: |
          TARGET="${{ steps.render.outputs.TARGET_FILE }}"
          THUMB="${{ steps.thumb.outputs.THUMB_FILE }}"

          echo "Publishing release: $TAG_NAME"

          gh release delete "$TAG_NAME" -y --cleanup-tag 2>/dev/null || true
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push origin :refs/tags/"$TAG_NAME" 2>/dev/null || true

          gh release create "$TAG_NAME" \
            "$TARGET" \
            "$THUMB" \
            --title "🎬 Render • $TAG_NAME" \
            --notes "Automated video render completed successfully."

          echo "✅ Release published: https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
