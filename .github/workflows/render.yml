name: Video Renderer

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Video plan JSON payload'
        required: true
        type: string
      job_id:
        description: 'Unique Job ID / Tag name'
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System and Python Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --upgrade pip
          pip install edge-tts requests

      - name: Fast Video Render & Mastering
        env:
          PLAN: ${{ inputs.plan }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python render.py

      - name: Publish Video Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.job_id }}
        run: |
          TARGET_FILE=""
          if [ -f "out/final.mp4" ]; then
            TARGET_FILE="out/final.mp4"
          elif [ -f "output/final_video.mp4" ]; then
            TARGET_FILE="output/final_video.mp4"
          else
            echo "Error: Output video file not found!"
            exit 1
          fi

          echo "Found target video file: $TARGET_FILE"

          # ট্যাগ বা রিলিজ আগে থেকে থাকলে ওভাররাইট/আপডেট করবে
          gh release delete "$TAG_NAME" -y --cleanup-tag || true
          git tag -d "$TAG_NAME" || true
          git push origin :refs/tags/"$TAG_NAME" || true

          gh release create "$TAG_NAME" "$TARGET_FILE" \
            --title "Render Job: $TAG_NAME" \
            --notes "Automated video render completed successfully."
